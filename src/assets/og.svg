<svg
	xmlns="http://www.w3.org/2000/svg"
	width="1200"
	height="630"
	viewBox="0 0 1200 630"
	font-family="'Noto Sans Mono', 'DejaVu Sans Mono', ui-monospace, monospace"
>
	<title>4ster.dev open graph card</title>
	<!--
		Source for public/og.png. Social platforms need a raster og:image, so this
		SVG is rendered at 1200x630 with the site's Inter fonts installed before
		it is committed. See the README for the render command.
	-->

	<defs>
		<!-- Teal glow anchored behind the terminal card. -->
		<radialGradient id="glow" cx="0.74" cy="0.5" r="0.62">
			<stop offset="0" stop-color="#4fb3a2" stop-opacity="0.20" />
			<stop offset="1" stop-color="#4fb3a2" stop-opacity="0" />
		</radialGradient>

		<!-- Brand gradient shared by the edge bar and the wordmark. -->
		<linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#6cc4b4" />
			<stop offset="1" stop-color="#3a8f80" />
		</linearGradient>

		<!-- Faint 48px grid. -->
		<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
			<path
				d="M48 0H0V48"
				fill="none"
				stroke="#dce8ea"
				stroke-opacity="0.035"
			/>
		</pattern>
	</defs>

	<rect width="1200" height="630" fill="#0f1419" />
	<rect width="1200" height="630" fill="url(#grid)" />
	<rect width="1200" height="630" fill="url(#glow)" />
	<rect x="0" y="0" width="8" height="630" fill="url(#mark)" />

	<!-- Identity -->
	<text x="92" y="168" font-size="20" letter-spacing="6" fill="#4fb3a2">
		OPEN SOURCE DEVELOPER
	</text>
	<text
		x="88"
		y="288"
		font-family="Inter, 'DejaVu Sans', sans-serif"
		font-weight="700"
		font-size="96"
		fill="url(#mark)"
	>
		✰λster✰
	</text>
	<text x="92" y="344" font-size="27" fill="#9fb3b6">David Vivar Bogónez</text>

	<line
		x1="92"
		y1="392"
		x2="600"
		y2="392"
		stroke="#dce8ea"
		stroke-opacity="0.12"
	/>

	<!-- Stack -->
	<text x="92" y="438" font-size="23" fill="#c8d8da">
		Python · Rust · TypeScript · Java
	</text>
	<text x="92" y="474" font-size="23" fill="#c8d8da">
		SQL · Docker / Podman
	</text>

	<!-- Terminal card -->
	<g>
		<rect
			x="700"
			y="150"
			width="410"
			height="300"
			rx="18"
			fill="#161d24"
			stroke="#4fb3a2"
			stroke-opacity="0.22"
		/>
		<circle cx="732" cy="184" r="7" fill="#e06a72" />
		<circle cx="756" cy="184" r="7" fill="#e0b483" />
		<circle cx="780" cy="184" r="7" fill="#5cc9a7" />
		<text x="810" y="189" font-size="15" fill="#6b7d80">
			aster@4ster.dev: ~
		</text>
		<line
			x1="700"
			y1="210"
			x2="1110"
			y2="210"
			stroke="#dce8ea"
			stroke-opacity="0.08"
		/>
		<text x="728" y="252" font-size="19">
			<tspan fill="#4fb3a2">$</tspan>
			<tspan fill="#dce8ea">whoami</tspan>
		</text>
		<text x="728" y="286" font-size="19" fill="#9fb3b6">aster</text>
		<text x="728" y="330" font-size="19">
			<tspan fill="#4fb3a2">$</tspan>
			<tspan fill="#dce8ea">ls ~/projects</tspan>
		</text>
		<text x="728" y="364" font-size="19" fill="#9fb3b6">
			artscii sentinel http
		</text>
		<text x="728" y="398" font-size="19" fill="#9fb3b6">
			bfcompiler perlin py-logic
		</text>
		<rect x="728" y="414" width="11" height="18" fill="#4fb3a2" />
	</g>

	<text x="1108" y="560" text-anchor="end" font-size="24" fill="#4fb3a2">
		4ster.dev
	</text>
</svg>
